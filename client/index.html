<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyBoard</title><link rel="stylesheet" href="/styles.css"></head><body><header><a class="brand" href="#">StudyBoard</a><nav><button data-page="studies">모집글</button><button data-page="mine">내 활동</button><button data-page="login" id="authNav">로그인</button><button id="logout" hidden>로그아웃</button></nav></header><main><div id="notice" role="status"></div><section id="loginPage" class="page"><h1>StudyBoard 시작하기</h1><div class="grid"><form id="loginForm" class="card"><h2>로그인</h2><label>아이디<input name="username" required autocomplete="username"></label><label>비밀번호<input name="password" type="password" required autocomplete="current-password"></label><button>로그인</button></form><form id="signupForm" class="card"><h2>회원가입</h2><label>아이디<input name="username" minlength="3" required></label><label>이름<input name="displayName" required></label><label>비밀번호 (8자 이상)<input name="password" type="password" minlength="8" required></label><button>가입하기</button></form></div></section><section id="studiesPage" class="page" hidden><div class="titleRow"><div><p class="eyebrow">함께하는 공부를 시작해요</p><h1>스터디 모집</h1></div><form id="searchForm"><input name="search" placeholder="제목 검색"><select name="sort"><option value="latest">최신순</option><option value="deadline">마감일순</option><option value="title">제목순</option></select><button>검색</button></form></div><form id="createStudy" class="card inline" hidden><h2>모집글 등록</h2><input name="title" placeholder="스터디 제목" required maxlength="100"><input name="description" placeholder="소개"><input name="capacity" type="number" min="1" placeholder="정원" required><label>마감일<input name="deadline" type="date" required></label><button>등록</button></form><div id="studyList" class="cards"></div></section><section id="detailPage" class="page" hidden><button class="textButton" data-page="studies">← 모집글 목록</button><div id="studyDetail"></div></section><section id="minePage" class="page" hidden><h1>내 활동</h1><div id="myStudies" class="cards"></div><h2>내 지원 현황</h2><div id="myApps" class="cards"></div></section><section id="roomPage" class="page" hidden><button class="textButton" data-page="mine">← 내 활동</button><div id="room"></div></section></main><footer>StudyBoard · 모집부터 함께하는 작업 관리까지</footer><script type="module" src="/app.js"></script></body></html>
